<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AutoApply pairing</title><link rel="stylesheet" href="shared.css"></head>
<body class="options"><main>
  <h1><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A9 9 0 0 1 8.5 4 9 9 0 1 0 20 15.5Z"/></svg> Pair AutoApply</h1>
  <p>Copy the Chrome extension pairing key from your dashboard Settings.</p>
  <form id="pairing">
    <label for="server">Server URL</label><input id="server" type="url" required disabled placeholder="http://127.0.0.1:8765">
    <label for="key">Pairing key</label><input id="key" type="password" required disabled autocomplete="off">
    <div class="actions"><button type="submit" disabled>Save</button><button id="test" type="button" disabled>Test connection</button></div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</main><script type="module" src="options.js"></script></body>
</html>
