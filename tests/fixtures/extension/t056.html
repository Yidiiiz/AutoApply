<!doctype html><html lang="en"><meta charset="utf-8"><title>Local structure fixture</title>
<h1>Application questions</h1><form onsubmit="event.preventDefault()">
<label>Full name <input name="name" required></label>
<label>Email <input name="email" type="email" required></label>
<label>Phone <input name="phone" type="tel" required></label>
<label>City <input name="city" required></label>
<label>Website <input name="website" type="url" required></label>
<label>About you <textarea name="about" required></textarea></label>
<fieldset><legend>Have you previously held this specific local fixture credential?</legend>
<label><input type="radio" name="credential" value="yes" required>Yes</label>
<label><input type="radio" name="credential" value="no" required>No</label></fieldset>
<label><input type="checkbox" name="privacy" required>Allow us to process your personal information</label>
<label>Optional fixture note <input name="optional"></label>
<button type="button">Continue</button></form></html>
