<!doctype html><meta charset="utf-8"><title>Synthetic Lever application</title>
<style>input {width:230px;height:40px} .visible-resume-upload {display:inline-block;position:relative;width:230px;height:40px}
.invisible-resume-upload {opacity:0;position:absolute;inset:0} .application-label {display:block}</style>
<h1>Humble Robotics</h1><h2>Software intern</h2>
<form onsubmit="actions.push('submit');return false"><ul>
<li class="application-question resume"><label><div class="application-label">Resume/CV *</div><div class="application-field">
<a class="postings-btn template-btn-utility visible-resume-upload">ATTACH RESUME/CV<input type="file" name="resume" id="resume-upload-input" class="application-file-input invisible-resume-upload" accept=".pdf"></a>
<span role="status">Couldn't auto read / analyzing / success</span></div></label></li>
<li class="application-question"><label><div class="application-label">Full name *</div><div class="application-field"><input type="text" name="name" required></div></label></li>
<li class="application-question"><label><div class="application-label">Email *</div><div class="application-field"><input type="email" name="email" required></div></label></li>
<li class="application-question"><label><div class="application-label">Phone *</div><div class="application-field"><input type="text" name="phone" required></div></label></li>
<li class="application-question"><label><div class="application-label">Current location *</div><div class="application-field"><input type="text" name="location" id="location-input" class="location-input" required><span role="status">Loading location error</span></div></label></li>
<li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="company"></div></label></li>
<li class="application-question"><label><div class="application-label">Portfolio URL</div><div class="application-field"><input type="text" name="portfolio"></div></label></li>
<li class="application-question"><label><div class="application-field"><input type="text" name="urls[Other]"></div></label></li>
</ul><button type="submit" onclick="actions.push('click')">Submit application</button></form>
<script>var actions=[];document.querySelector('[type=file]').addEventListener('change',e=>{e.target.closest('.application-field').querySelector('[role=status]').textContent=e.target.files[0]?.name || 'No file';});</script>
