<!doctype html><meta charset="utf-8"><style>input,button{min-height:24px}[hidden]{display:none!important}[data-automation-id=activeListContainer]{height:300px;overflow:auto;width:400px;border:1px solid} [role=option]{height:30px;box-sizing:border-box}</style>
<h1>My Experience</h1><form><section><div role="group" aria-labelledby="education-title"><h5 id="education-title">Education 1</h5>
<div data-automation-id="formField-schoolName"><label for="education-8--schoolName">School or University*</label><input id="education-8--schoolName" name="schoolName" type="text"></div>
<div data-automation-id="formField-degree"><label>Degree*</label><button type="button" id="education-8--degree" aria-label="Degree High School Required">High School</button></div>
<div data-automation-id="formField-fieldOfStudy"><label for="education-8--fieldOfStudy">Field of Study</label><div data-automation-id="multiSelectContainer"><div data-automation-id="multiselectInputContainer"><input id="education-8--fieldOfStudy"><span data-automation-id="promptIcon"></span><button type="button">Help</button></div><ul data-automation-id="selectedItemList"></ul></div></div>
<div data-automation-id="formField-gradeAverage"><label for="education-8--gradeAverage">Overall Result (GPA)</label><input id="education-8--gradeAverage" name="gradeAverage"></div>
<div data-automation-id="formField-firstYearAttended"><fieldset><legend>From</legend><div data-automation-id="dateInputWrapper" id="education-8--firstYearAttended"><input data-automation-id="dateSectionYear-input" role="spinbutton"></div></fieldset></div>
<div data-automation-id="formField-lastYearAttended"><fieldset><legend>To (Actual or Expected)*</legend><div data-automation-id="dateInputWrapper" id="education-8--lastYearAttended"><input data-automation-id="dateSectionYear-input" role="spinbutton"></div></fieldset></div>
</div></section><div data-automation-id="formField-skills"><label for="skills--skills">Skills</label><div data-automation-id="multiSelectContainer"><ul data-automation-id="selectedItemList"></ul><div data-automation-id="multiselectInputContainer"><div data-automation-id="monikerSearchBox"><input data-automation-id="searchBox" id="skills--skills"></div></div></div></div></form>
<script>
window.scrolls=[];window.searches=[];
const degree=document.getElementById('education-8--degree');
degree.onclick=()=>{const list=document.createElement('div');list.role='listbox';for(const name of ['High School','Bachelors',"Bachelor's Degree",'Masters']){const row=document.createElement('div');row.role='option';row.textContent=name;row.onclick=()=>{degree.textContent=name;degree.setAttribute('aria-label','Degree '+name+' Required');list.remove();};list.append(row);}document.body.append(list);};
for(const input of document.querySelectorAll('[data-automation-id=multiSelectContainer] input')){
 let popup;
 input.onkeydown=event=>{if(event.key==='Escape'){popup?.remove();return;}if(event.key!=='Enter')return;event.preventDefault();popup?.remove();searches.push(input.value);popup=document.createElement('div');popup.dataset.automationId='responsiveMonikerPrompt';popup.innerHTML='<div data-automation-id="multiSelectHeader">Options</div><div data-automation-id="promptTitle">Results</div><div data-automation-id="activeListContainer" role="listbox" aria-label="Options Expanded"></div>';document.body.append(popup);
 const list=popup.querySelector('[role=listbox]');const wanted=input.id==='skills--skills'?'Java':'Computer Science';const names=Array.from({length:120},(_,i)=>(wanted==='Java'?'Java Related ':'Computer Related ')+i);names[97]=wanted;
 function render(){const first=Math.floor(list.scrollTop/30);list.replaceChildren();const top=document.createElement('div');top.style.height=(first*30)+'px';list.append(top);for(const name of names.slice(first,first+10)){const presentation=document.createElement('div');presentation.role='presentation';const row=document.createElement('div');row.role='option';row.dataset.automationId='menuItem';row.id='menuItem-'+name;row.setAttribute('aria-label',name+' not checked');row.innerHTML='<div data-automation-id="promptLeafNode"><div data-automation-id="checkbox"><input type="checkbox" data-automation-id="checkboxPanel"></div><div data-automation-id="promptOption"></div></div>';row.querySelector('[data-automation-id=promptOption]').textContent=name;row.onclick=()=>{row.setAttribute('aria-label',name+' checked');const pill=document.createElement('li');pill.dataset.automationId='selectedItem';pill.textContent=name;input.closest('[data-automation-id=multiSelectContainer]').querySelector('ul').append(pill);};presentation.append(row);list.append(presentation);}const bottom=document.createElement('div');bottom.style.height=(Math.max(0,120-first-10)*30)+'px';list.append(bottom);}
 list.onscroll=()=>{scrolls.push(list.scrollTop);setTimeout(render,100);};setTimeout(render,100);
 };input.oninput=()=>{if(!input.value)popup?.remove();};
}
document.querySelector('form').onsubmit=e=>{e.preventDefault();throw Error('Submission forbidden');};
</script>
