<!doctype html><meta charset="utf-8"><title>Current application repair</title>
<style>body{font:16px sans-serif;margin:24px}label{display:block;margin:12px 0}</style>
<form>
<label>Full name<input id="full" required></label>
<label>Email<input id="email" type="email" required></label>
<label>Contact consent<input id="consent" type="checkbox" required></label>
<label>Country<select id="country" required><option value="">Select</option><option value="us">United States</option><option>Canada</option></select></label>
<label>Existing answer<input id="manual" value="PRIVATE_MANUAL"></label>
<label>Unknown personal fact<input id="unknown" required></label>
<label>Resume<input type="file"></label>
<label>Why this role?<textarea></textarea></label>
<button type="submit">Submit application</button><button type="button">Next</button>
<button type="button">Add education</button><button type="button">Add work experience</button>
<button type="button">Upload</button>
</form>
<script>
window.actions=[];document.querySelector('form').onsubmit=e=>{e.preventDefault();actions.push('submit')};
document.querySelectorAll('button[type=button]').forEach(b=>b.onclick=()=>actions.push(b.textContent));
</script>
