<!doctype html><html><head><title>Job application account</title></head><body>
<main><h1 id="heading">Sign in to apply</h1><form id="auth">
<label>Email<input id="email" type="email" autocomplete="username"></label>
<label>Password<input id="password" type="password"></label>
<label id="confirmation" hidden>Confirm new password<input id="confirm" type="password" autocomplete="new-password"></label>
<label>Ordinary application field<input id="mixed"></label>
<label><input id="agreement" type="checkbox">I agree</label>
<button id="submit">Sign in</button><button type="button" id="oauth">Continue with OAuth</button>
</form></main>
<script>
window.submissions=0;window.oauthClicks=0;window.events=[];window.reactState={};
auth.onsubmit=e=>{e.preventDefault();submissions++;};oauth.onclick=()=>oauthClicks++;
for(const input of document.querySelectorAll('input:not([type=checkbox])')){
 const native=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
 // React-style own setter tracking; native prototype updates + bubbling input commit state.
 Object.defineProperty(input,'value',{configurable:true,get(){return native.get.call(this);},set(value){native.set.call(this,value);}});
 for(const type of ['input','change'])input.addEventListener(type,()=>{events.push(input.id+':'+type);reactState[input.id]=input.value;});
}
window.signup=()=>{heading.textContent='Create account to apply';submit.textContent='Create account';confirmation.hidden=false;password.autocomplete='new-password';};
</script></body></html>
