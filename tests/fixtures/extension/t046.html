<!doctype html><meta charset="utf-8"><style>input{min-height:24px} [role=option]{padding:8px} [hidden]{display:none} #popup{border:1px solid;width:300px}</style>
<h1>Fixture engineer</h1><p>JavaScript TypeScript Python Rust Kubernetes</p>
<form><div data-automation-id="formField-skills"><label>Type to Add Skills</label><div data-automation-id="multiSelectContainer"><div data-automation-id="multiselectInputContainer"><ul data-automation-id="selectedItemList" role="listbox" aria-label="items selected"></ul><div data-automation-id="monikerSearchBox"><input data-automation-id="searchBox" id="skills--skills"><span data-automation-id="promptSelectionLabel"></span><button type="button" data-automation-id="clearSearchButton">Clear</button><button type="button" data-automation-id="promptSearchButton">Search</button></div></div></div></div></form>
<div id="popup" data-automation-id="responsiveMonikerPrompt" hidden><div data-automation-id="multiSelectHeader">Skills</div><div data-automation-id="promptTitle">Options</div><div data-automation-id="activeListContainer" role="listbox" aria-label="Options Expanded"></div></div>
<script>
window.searches=[];window.selectionEvents=[];
const input=document.getElementById('skills--skills'),popup=document.getElementById('popup'),list=popup.querySelector('[role=listbox]'),pills=document.querySelector('[data-automation-id=selectedItemList]');
function pill(name){const li=document.createElement('li');li.dataset.automationId='menuItem';const item=document.createElement('div');item.dataset.automationId='selectedItem';item.setAttribute('role','option');item.id='pill-'+name;item.setAttribute('aria-label',name+', press delete to clear value.');item.textContent=name;const remove=document.createElement('div');remove.dataset.automationId='DELETE_charm';li.append(item,remove);pills.append(li);}
['OCaml','Linux/Unix','Unreal Engine','VS Code','Arduino Microcontrollers'].forEach(pill);
const catalog={'TypeScript':['TypoScript','Adobe Type','Type Design','Typesetting','Typewriting','VisualScript','TypeScript'],'JavaScript':['JavaScript'],'Python':['Python'],'Rust':['Rust'],'JS/TS':['TypoScript'],'ECMAScript':['JavaScript'],'Node':['Node.js'],'Unknown':['VisualScript']};
input.onkeydown=e=>{if(e.key==='Escape')popup.hidden=true;if(e.key!=='Enter')return;e.preventDefault();searches.push(input.value);popup.hidden=false;list.textContent='Loading';setTimeout(()=>{list.replaceChildren();for(const [i,name] of (catalog[input.value] || []).entries()){const presentation=document.createElement('div');presentation.setAttribute('role','presentation');const row=document.createElement('div');row.dataset.automationId='menuItem';row.setAttribute('role','option');row.id='menuItem-REMOTE_SKILL-1-'+(269162+i);row.setAttribute('aria-label',name+' not checked');const leaf=document.createElement('div');leaf.dataset.automationId='promptLeafNode';const box=document.createElement('div');box.dataset.automationId='checkbox';const check=document.createElement('input');check.type='checkbox';check.dataset.automationId='checkboxPanel';box.append(check);const text=document.createElement('div');text.dataset.automationId='promptOption';text.textContent=name;leaf.append(box,text);row.append(leaf);for(const type of ['pointerdown','mousedown','pointerup','mouseup'])row.addEventListener(type,()=>selectionEvents.push(type));row.onclick=()=>{check.checked=true;row.setAttribute('aria-label',name+' checked');if(!Array.from(pills.querySelectorAll('[data-automation-id=selectedItem]')).some(p=>p.textContent===name))pill(name);};presentation.append(row);list.append(presentation);}if(!list.children.length)list.textContent='No Items';},100);};
input.oninput=()=>{if(!input.value)popup.hidden=true;};document.querySelector('form').onsubmit=e=>{e.preventDefault();throw Error('Submission forbidden');};
</script>
