<!doctype html><link rel="stylesheet" href="style.css"><script src="audit.js"></script>
<h1>Application</h1><form><label>First Name<input name="first_name"></label><button type="submit">Submit application</button></form>
<script>
window.attempts = Promise.all([
  fetch('/submitApplication', {method:'POST',body:'{}'}).catch(() => 'aborted'),
  fetch('/graphql', {method:'POST',body:JSON.stringify({operationName:'finalizeApplication'})}).catch(() => 'aborted'),
  fetch('/finalizeApplication', {method:'PUT',body:'{}'}).catch(() => 'aborted'),
  fetch('/action', {method:'PATCH',body:JSON.stringify({action:'submitApplication'})}).catch(() => 'aborted'),
  fetch('/submitApplication', {method:'DELETE'}).catch(() => 'aborted')
]);
</script>
