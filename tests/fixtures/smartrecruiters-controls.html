<!doctype html><meta charset="utf-8">
<!-- Structural fixture reflecting the saved Easy Apply screenshot. Synthetic
     options and handlers exercise behaviors; no applicant data or live tokens. -->
<form id="unrelated"></form>
<main><h2>Personal information</h2><section id="step">
<label>First name *<input name="firstName" required autocomplete="given-name"></label>
<div id="component"></div>
<label>Email *<input type="email" autocomplete="email" required></label>
<fieldset><legend>Work authorization *</legend><label><input type="radio" name="auth" required>Yes</label><label><input type="radio" name="auth">No</label></fieldset>
<label>Consent<input type="checkbox"></label>
<label>Country<select required><option value="">Choose</option><option>United States</option></select></label>
<label>City<input role="combobox" aria-controls="options" aria-expanded="false" onclick="openCity()" oninput="openCity()"></label>
<div id="options" role="listbox" hidden><div role="option" onclick="const city=document.querySelector('[role=combobox]');city.value='Boston';city.setAttribute('aria-expanded','false');this.parentElement.hidden=true">Boston</div></div>
<script>function openCity(){document.querySelector('#options').hidden=false;document.querySelector('[role=combobox]').setAttribute('aria-expanded','true')}</script>
<label>Message<textarea></textarea></label>
<label>Resume *<input type="file" required onchange="this.parentElement.insertAdjacentHTML('afterend','<span>'+this.files[0].name+'</span>')"></label>
</section>
<button hidden>Next</button><button id="next" onclick="document.querySelector('#step').innerHTML='<label>Gender<select><option>Decline to self-identify</option></select></label>';this.textContent='Submit application'">Next</button></main>
<script>document.querySelector('#component').attachShadow({mode:'open'}).innerHTML='<label>Last name *<input required autocomplete="family-name"></label>';</script>
